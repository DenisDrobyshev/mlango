# GitLab mirror of the GitHub Actions pipeline in .github/workflows/ci.yml.
# Keep the two in step: a contributor may only ever see one of them.

stages: [lint, test, verify]

default:
  image: python:3.12
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/pip]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

lint:
  stage: lint
  script:
    - pip install -e ".[dev]"
    - ruff check mlango tests
    - ruff format --check mlango tests
    # Blocking, as on GitHub: users type-check their own code against these
    # annotations, so the annotations have to be true.
    - mypy mlango

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  image: python:$PYTHON_VERSION
  script:
    - pip install -e ".[sklearn,dev]"
    # No coverage gate across the matrix; the `coverage` job is the gate.
    - pytest -q

coverage:
  stage: test
  script:
    - pip install -e ".[sklearn,dev]"
    # fail_under lives in pyproject.toml, so the same threshold applies here,
    # on GitHub, and on a laptop.
    - pytest -q --cov --cov-report=term-missing --cov-report=xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

audit:
  stage: test
  script:
    # Upgrade pip first: the base image ships an old one, and pip has its own
    # advisories. They are real, but they are the image's, not this package's —
    # auditing a stale build tool tells a user nothing about what they install.
    - pip install --upgrade pip
    - pip install -e ".[sklearn,dev]" pip-audit
    # Audits what is installed, which is what a user gets. --skip-editable
    # leaves out mlango itself, which has no release to compare against, and
    # --strict cannot be combined with it: strict fails on anything it could not
    # audit, including the package skipped on purpose.
    - pip-audit --desc --skip-editable

quickstart:
  stage: verify
  script:
    # `dev` too: the scaffold ships tests, and running them below needs pytest.
    - pip install -e ".[sklearn,dev]"
    # The README promises four commands from nothing to a working admin.
    # This job is what keeps that promise honest.
    - mlango startproject demoproject
    - cd demoproject
    - python manage.py check
    - python manage.py migrate
    - python manage.py makemigrations
    - python manage.py migrate
    - python manage.py train demo.Sentiment
    - python manage.py evaluate demo.SentimentAccuracy --min-pass-rate 0.9
    - python manage.py sweep demo.Sentiment -p C=0.5,2.0 --metric accuracy --mode max
    - python manage.py agent demo.Helper 'hello there'
    - python manage.py runs list
    - python manage.py traces list
    - python manage.py dataset head demo.Reviews -n 3
    - python manage.py dataset materialize demo.Reviews
    # The scaffold ships tests; a new project should be green before it is edited.
    - python manage.py test
    - python manage.py runserver 8099 &
    - |
      for _ in $(seq 1 30); do
        curl -sf http://127.0.0.1:8099/api/health >/dev/null && break
        sleep 1
      done
    - curl -sf http://127.0.0.1:8099/api/health
    - |
      curl -sf -X POST http://127.0.0.1:8099/api/predict/ \
        -H 'Content-Type: application/json' \
        -d '{"input": "great movie, loved every minute"}'
    - |
      curl -sf -X POST http://127.0.0.1:8099/api/chat/ \
        -H 'Content-Type: application/json' \
        -d '{"message": "hello"}'
    # A stream route must not take the schema down with it.
    - curl -sf http://127.0.0.1:8099/api/openapi.json > /dev/null
    - test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/admin/)" = "200"
    - test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/admin/o/nope.Nope)" = "404"

build:
  stage: verify
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    - python -m venv /tmp/fresh
    - /tmp/fresh/bin/pip install dist/*.whl
    - /tmp/fresh/bin/mlango --version
    # py.typed has to ship, or the annotations are invisible downstream.
    - /tmp/fresh/bin/python -c "import importlib.resources as r, mlango; assert (r.files(mlango) / 'py.typed').is_file()"
  artifacts:
    paths: [dist/]
    expire_in: 2 weeks

pages:
  # GitLab Pages hosts the site even while the project is private: with Pages
  # access control it is served to project members only. GitHub Pages cannot do
  # that without a paid plan, which is why the GitHub workflow only publishes
  # once the repository is public and this job is the one that actually serves
  # the documentation today.
  #
  # Turn it on under Settings -> Pages after the first run. The name of this job
  # and the `public/` directory are both fixed by GitLab, not chosen here.
  stage: verify
  script:
    - pip install mkdocs-material mkdocs-static-i18n
    - mkdocs build --strict --site-dir public
  artifacts:
    paths: [public/]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docs:
  stage: verify
  # Still built on every branch and merge request: --strict is what catches a
  # broken link, and that check should not wait for the default branch.
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  script:
    - pip install mkdocs-material mkdocs-static-i18n
    - mkdocs build --strict
  artifacts:
    paths: [site/]
    expire_in: 2 weeks
