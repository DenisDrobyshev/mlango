[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlango"
dynamic = ["version"]
description = "A batteries-included framework for machine learning and LLM agents, built on Django's philosophy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Denis Drobyshev", email = "drobishev.denis@icloud.com" }]
keywords = ["machine-learning", "mlops", "agents", "llm", "framework", "experiment-tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3", "joblib>=1.3"]
torch = ["torch>=2.0"]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]
all = [
    "mlango[sklearn,torch,anthropic,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/DenisDrobyshev/mlango"
Repository = "https://github.com/DenisDrobyshev/mlango"

[project.scripts]
mlango = "mlango.management.manager:main"

[tool.hatch.version]
path = "mlango/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mlango"]

[tool.hatch.build.targets.sdist]
include = ["/mlango", "/tests", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["mlango/conf/project_template", "mlango/conf/app_template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
